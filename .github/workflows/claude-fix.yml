name: claude-fix (reusable)

# Shared implementation. Repos don't call this directly on issue_comment - each
# repo has its own tiny caller workflow (see templates/caller-workflow.yml) that
# does the /fix + login gating, then invokes this with its own scheme/bundle-id/
# team-id. Runs on the shared mac-mini-runner (org-level self-hosted runner), so
# it has access to the Mac's Xcode, signing keychain, and logged-in Claude Code
# subscription. See README.md for one-time setup shared by every caller repo.
#
# Two jobs, mutually exclusive on the triggering comment's text: `fix`
# resolves one issue (a plain /fix comment); `fixall` (/fixall) queues a
# /fix on every open issue in the repo instead of resolving anything itself.

on:
  workflow_call:
    inputs:
      scheme:
        required: true
        type: string
      bundle_id:
        required: true
        type: string
      team_id:
        required: true
        type: string
      xcodeproj_path:
        required: true
        type: string
      enable_testflight:
        required: false
        type: boolean
        default: true
    secrets:
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false
      NTFY_TOPIC:
        required: false

jobs:
  fix:
    # /fixall is handled entirely by the fixall job below - without this
    # guard, this job would also run for it (since it starts with "/fix"
    # too, which is what the caller's own gating checks for) and try to
    # "resolve" the literal text /fixall as if it were a fix instruction.
    if: ${{ !startsWith(github.event.comment.body, '/fixall') }}
    permissions:
      contents: write
      issues: write
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Acknowledge
        run: |
          # A just-created issue can lag behind on GitHub's GraphQL backend for a
          # few seconds, so retry rather than fail the whole run over this.
          for i in 1 2 3 4 5; do
            gh issue comment "$ISSUE_NUMBER" --body "🤖 Working on it..." && break
            echo "Retrying acknowledge comment ($i/5)..."
            sleep 3
          done

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout claude-fix tooling
        uses: actions/checkout@v4
        with:
          repository: PeteHHHH/claude-fix
          path: .claude-fix-tools

      - name: Record starting commit
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code on the issue
        id: claude
        run: |
          set -o pipefail
          {
            echo "Resolve this GitHub issue in the ${{ github.event.repository.name }} repo."
            echo
            echo "Issue #$ISSUE_NUMBER: ${{ github.event.issue.title }}"
            echo
            echo "${{ github.event.issue.body }}"
            echo
            echo "Before doing anything else, run 'gh issue view $ISSUE_NUMBER --comments'"
            echo "yourself to read the full thread on this issue — every comment, not just"
            echo "the one below. That includes any discussion and, if this issue has been"
            echo "through /fix before, this workflow's own status comments on prior attempts"
            echo "(🤖 working on it, ✅ shipped, ⚠️ landed but didn't ship, ❌ failed, ℹ️ no"
            echo "change needed). Use that to avoid repeating a dead end, redoing work that"
            echo "already landed, or losing context a prior attempt already worked out."
            echo
            echo "Latest instruction from the /fix comment:"
            echo "${{ github.event.comment.body }}"
            echo
            echo "Follow CLAUDE.md exactly: verify the build before considering the"
            echo "fix done, then commit and push directly to main yourself."
            echo
            echo "Do NOT use a GitHub closing keyword (Closes/Fixes/Resolves, etc.) with"
            echo "the issue number in your commit message. This workflow closes the issue"
            echo "itself once the build-number bump and TestFlight upload after your commit"
            echo "have also succeeded — a closing keyword would close it the moment your"
            echo "commit lands, even if a later step then fails. Just reference the issue"
            echo "plainly, e.g. 'Issue #$ISSUE_NUMBER: ...'."
          } > "$RUNNER_TEMP/prompt.txt"

          echo "Other claude processes running at start of this attempt:"
          pgrep -fl "claude -p" || echo "(none)"

          CLAUDE_EXIT=1
          for attempt in 1 2 3; do
            set +e
            claude -p "$(cat "$RUNNER_TEMP/prompt.txt")" \
              --allowedTools "Edit Write Read Glob Grep Bash(git *) Bash(xcodebuild *) Bash(python3 *) Bash(xcrun *) Bash(cp *) Bash(ls *) Bash(cat *) Bash(find *) Bash(mkdir *) Bash(env) Bash(printenv *) Bash(xcodegen *) Bash(sed *) Bash(grep *) Bash(rm *) Bash(which *) Bash(command *) Bash(pwd) Bash(swift *) Bash(echo *) Bash(gh issue *) Bash(gh pr *) Bash(gh run *)" \
              --output-format json \
              > "$RUNNER_TEMP/claude-result.json" \
              2> "$RUNNER_TEMP/claude-stderr.log"
            CLAUDE_EXIT=$?
            set -e

            echo "Attempt $attempt: claude exited $CLAUDE_EXIT, stdout $(wc -c < "$RUNNER_TEMP/claude-result.json") bytes"

            if [ "$CLAUDE_EXIT" -eq 0 ] && jq -e . "$RUNNER_TEMP/claude-result.json" > /dev/null 2>&1; then
              break
            fi

            echo "--- stderr (attempt $attempt) ---"
            cat "$RUNNER_TEMP/claude-stderr.log"
            echo "--- stdout (attempt $attempt) ---"
            cat "$RUNNER_TEMP/claude-result.json"
            echo "Other claude processes running right after failure:"
            pgrep -fl "claude -p" || echo "(none)"

            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 10s in case this was transient..."
              sleep 10
            fi
          done

          if [ "$CLAUDE_EXIT" -eq 0 ] && jq -e . "$RUNNER_TEMP/claude-result.json" > /dev/null 2>&1; then
            cat "$RUNNER_TEMP/claude-result.json"
            IS_ERROR=$(jq -r '.is_error' "$RUNNER_TEMP/claude-result.json")
            echo "is_error=$IS_ERROR" >> "$GITHUB_OUTPUT"
            jq -r '.result' "$RUNNER_TEMP/claude-result.json" > "$RUNNER_TEMP/claude-summary.txt"
          else
            echo "is_error=true" >> "$GITHUB_OUTPUT"
            {
              echo "claude exited $CLAUDE_EXIT after 3 attempts with no usable JSON output."
              echo
              echo "Last attempt's stderr:"
              cat "$RUNNER_TEMP/claude-stderr.log"
              echo
              echo "Last attempt's raw stdout:"
              cat "$RUNNER_TEMP/claude-result.json"
            } > "$RUNNER_TEMP/claude-summary.txt"
          fi

      - name: Report failure and stop
        if: steps.claude.outputs.is_error == 'true'
        run: |
          echo "::error title=claude-fix::Claude couldn't resolve issue #$ISSUE_NUMBER — see the summary comment"
          # Safety net: if Claude committed something (e.g. with a closing keyword
          # in the message, against instructions) before still reporting is_error,
          # GitHub may have already auto-closed the issue. A failed run must never
          # leave the issue closed.
          if [ "$(gh issue view "$ISSUE_NUMBER" --json state -q .state)" = "CLOSED" ]; then
            gh issue reopen "$ISSUE_NUMBER" || true
          fi
          {
            echo "❌ Couldn't finish this one automatically."
            echo
            cat "$RUNNER_TEMP/claude-summary.txt"
          } > "$RUNNER_TEMP/comment.txt"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.txt"
          bash .claude-fix-tools/scripts/notify.sh "$GH_REPO: fix failed" "Issue #$ISSUE_NUMBER needs a look."
          exit 1

      - name: Pull the commit Claude just pushed
        run: git pull --ff-only origin main

      - name: Check whether a release is still needed
        id: diff
        run: |
          CODE_CHANGED_THIS_RUN=false
          if [ "$(git rev-parse HEAD)" != "${{ steps.before.outputs.sha }}" ]; then
            CODE_CHANGED_THIS_RUN=true
          fi
          echo "changed=$CODE_CHANGED_THIS_RUN" >> "$GITHUB_OUTPUT"

          # A previous attempt on this same issue can have already landed the
          # code fix (and even the build-number bump) on main and then failed
          # at a later step, most often the TestFlight upload. On a retry,
          # Claude usually and correctly finds nothing left to change in the
          # code — which used to make the workflow conclude "nothing needed
          # shipping" and skip straight past the steps that actually failed
          # last time. So don't gate on this run's own diff alone: also check
          # git history for this issue's fix commit and bump commit (both
          # carry "issue #$ISSUE_NUMBER" in their message — Claude's by
          # instruction, the bump commit's always) to tell "genuinely nothing
          # to fix" apart from "already fixed, still needs shipping".
          ALREADY_BUMPED=false
          if git log --format=%s | grep -Eiq "^Bump to [0-9.]+ \([0-9]+\) for issue #$ISSUE_NUMBER\$"; then
            ALREADY_BUMPED=true
          fi
          echo "already_bumped=$ALREADY_BUMPED" >> "$GITHUB_OUTPUT"

          if [ "$CODE_CHANGED_THIS_RUN" = "true" ] || git log --format=%s | grep -Eiq "issue #$ISSUE_NUMBER"; then
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment when nothing needed shipping
        if: steps.diff.outputs.needs_release == 'false'
        run: |
          echo "::notice title=claude-fix::Issue #$ISSUE_NUMBER needed no code change — nothing shipped"
          {
            echo "ℹ️ Looked into it, but nothing needed to change on main — no build was shipped."
            echo
            echo "Summary from Claude:"
            cat "$RUNNER_TEMP/claude-summary.txt"
          } > "$RUNNER_TEMP/comment.txt"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.txt"
          bash .claude-fix-tools/scripts/notify.sh "$GH_REPO: no change needed" "Issue #$ISSUE_NUMBER: nothing to ship."

      - name: Bump version
        id: version
        if: steps.diff.outputs.needs_release == 'true'
        run: |
          if [ "${{ steps.diff.outputs.already_bumped }}" = "true" ]; then
            # A previous attempt on this issue already bumped and pushed the
            # version; only a later step (most likely the TestFlight upload)
            # failed. Reuse that version instead of bumping again.
            EXISTING="$(git log --format=%s | grep -Ei "^Bump to [0-9.]+ \([0-9]+\) for issue #$ISSUE_NUMBER\$" | head -1)"
            EXISTING_MARKETING="$(grep -oE '^Bump to [0-9.]+' <<<"$EXISTING" | grep -oE '[0-9.]+$')"
            EXISTING_BUILD="$(grep -oE '\([0-9]+\)' <<<"$EXISTING" | tr -d '()')"
            echo "marketing=$EXISTING_MARKETING" >> "$GITHUB_OUTPUT"
            echo "build=$EXISTING_BUILD" >> "$GITHUB_OUTPUT"
            echo "Reusing $EXISTING_MARKETING ($EXISTING_BUILD), already bumped for issue #$ISSUE_NUMBER by a previous attempt."
          else
            # Every ship moves MARKETING_VERSION forward, not just the build
            # number - a large diff (>=1000 changed lines this run) gets a
            # major bump (e.g. 2.9 -> 3.0) instead of the usual minor one.
            LINES_CHANGED=$(git diff --shortstat "${{ steps.before.outputs.sha }}" HEAD | grep -oE '[0-9]+ (insertion|deletion)s?' | grep -oE '^[0-9]+' | awk '{s+=$1} END {print s+0}')
            echo "Lines changed this run: $LINES_CHANGED"
            BUMP_KIND=auto
            if [ "$LINES_CHANGED" -ge 1000 ]; then
              BUMP_KIND=major
              echo "::notice title=claude-fix::Large change ($LINES_CHANGED lines) — doing a major version bump"
            fi

            BUMP_OUT="$(python3 .claude-fix-tools/scripts/bump_build_number.py --xcodeproj "${{ inputs.xcodeproj_path }}" --bundle-id "${{ inputs.bundle_id }}" --marketing-version "$BUMP_KIND")"
            echo "$BUMP_OUT"
            NEW_MARKETING="$(sed -n 's/^MARKETING_VERSION=//p' <<<"$BUMP_OUT")"
            NEW_BUILD="$(sed -n 's/^CURRENT_PROJECT_VERSION=//p' <<<"$BUMP_OUT")"
            echo "marketing=$NEW_MARKETING" >> "$GITHUB_OUTPUT"
            echo "build=$NEW_BUILD" >> "$GITHUB_OUTPUT"

            git add -A
            git -c user.name="claude-fix" -c user.email="noreply@anthropic.com" \
              commit -m "Bump to $NEW_MARKETING ($NEW_BUILD) for issue #$ISSUE_NUMBER"
            git push origin main
          fi

      - name: Archive, export, and upload to TestFlight
        id: release
        if: steps.diff.outputs.needs_release == 'true' && inputs.enable_testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SCHEME: ${{ inputs.scheme }}
          TEAM_ID: ${{ inputs.team_id }}
        run: bash .claude-fix-tools/scripts/export_and_upload.sh

      - name: Comment with result
        if: always() && steps.claude.outputs.is_error != 'true' && steps.diff.outputs.needs_release == 'true'
        run: |
          # Only a build that actually reached TestFlight (or wasn't meant to,
          # per enable_testflight) counts as fully shipped. Anything else —
          # including an upload failure — must not close the issue, and must
          # reopen it if a closing keyword in Claude's commit already did.
          if [ "${{ steps.release.outcome }}" = "success" ] || [ "${{ inputs.enable_testflight }}" = "false" ]; then
            SHIPPED=true
          else
            SHIPPED=false
          fi

          VERSION_STR="${{ steps.version.outputs.marketing }} (${{ steps.version.outputs.build }})"
          if [ "$SHIPPED" = "true" ]; then
            echo "::notice title=claude-fix::Issue #$ISSUE_NUMBER fixed and shipped — $VERSION_STR uploading to TestFlight"
          else
            echo "::warning title=claude-fix::Issue #$ISSUE_NUMBER fix landed on main, but the TestFlight upload failed ($VERSION_STR)"
            if [ "$(gh issue view "$ISSUE_NUMBER" --json state -q .state)" = "CLOSED" ]; then
              gh issue reopen "$ISSUE_NUMBER" || true
            fi
          fi
          {
            if [ "$SHIPPED" = "true" ]; then
              echo "✅ Fixed and shipped: $VERSION_STR is uploading to TestFlight."
            else
              echo "⚠️ Code fix landed on main, but the TestFlight upload failed or was skipped ($VERSION_STR). Check the workflow run."
            fi
            echo
            echo "Summary from Claude:"
            cat "$RUNNER_TEMP/claude-summary.txt"
          } > "$RUNNER_TEMP/comment.txt"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.txt"

          if [ "$SHIPPED" = "true" ]; then
            gh issue close "$ISSUE_NUMBER"
          fi

      - name: Notify
        if: always() && steps.claude.outputs.is_error != 'true' && steps.diff.outputs.needs_release == 'true'
        run: |
          if [ "${{ steps.release.outcome }}" = "success" ]; then
            bash .claude-fix-tools/scripts/notify.sh "$GH_REPO: shipped" "Issue #$ISSUE_NUMBER fixed, ${{ steps.version.outputs.marketing }} (${{ steps.version.outputs.build }}) uploading to TestFlight."
          else
            bash .claude-fix-tools/scripts/notify.sh "$GH_REPO: needs attention" "Issue #$ISSUE_NUMBER: fix landed but TestFlight upload failed or was skipped."
          fi

      - name: Catch anything unhandled
        if: failure() && steps.claude.outputs.is_error != 'true'
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "::error title=claude-fix::Unexpected failure on issue #$ISSUE_NUMBER — see $RUN_URL"
          # Same safety net as the other failure paths: an unexpected failure
          # must never leave the issue closed, even if an earlier commit's
          # message closed it against instructions.
          if [ "$(gh issue view "$ISSUE_NUMBER" --json state -q .state)" = "CLOSED" ]; then
            gh issue reopen "$ISSUE_NUMBER" || true
          fi
          gh issue comment "$ISSUE_NUMBER" --body "❌ claude-fix hit an unexpected error before it could finish or report back. [See the run log]($RUN_URL)." || true
          osascript -e "display notification \"Issue #$ISSUE_NUMBER: workflow failed unexpectedly.\" with title \"$GH_REPO: claude-fix crashed\"" || true

  fixall:
    # /fixall queues a plain "/fix" comment on every open issue instead of
    # resolving anything itself - each one then runs through the fix job
    # above exactly like a normal /fix, via its own separate issue_comment
    # event. The single self-hosted runner means they queue and run one at
    # a time rather than stampeding - no extra sequencing needed here.
    if: startsWith(github.event.comment.body, '/fixall')
    permissions:
      issues: write
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Queue /fix on every open issue
        run: |
          # Deliberately no GH_TOKEN here (unlike the fix job above) - gh
          # then falls back to this Mac's own logged-in `gh auth` session
          # (petehhhhh), so the /fix comments posted below are genuinely
          # authored by petehhhhh. Each caller workflow's own gating only
          # fires /fix for comments from petehhhhh specifically, so posting
          # these as github-actions[bot] (github.token's identity) would
          # silently do nothing at all.
          ISSUES="$(gh issue list --repo "$GH_REPO" --state open --json number -q '.[].number')"
          if [ -z "$ISSUES" ]; then
            gh issue comment "${{ github.event.issue.number }}" --repo "$GH_REPO" --body "ℹ️ /fixall: no open issues to fix." || true
            exit 0
          fi
          COUNT="$(wc -l <<<"$ISSUES" | tr -d ' ')"
          echo "Queuing /fix on $COUNT open issue(s): $(tr '\n' ' ' <<<"$ISSUES")"
          gh issue comment "${{ github.event.issue.number }}" --repo "$GH_REPO" --body "🤖 /fixall: queuing /fix on $COUNT open issue(s) - they'll run one at a time on the runner." || true
          while IFS= read -r n; do
            gh issue comment "$n" --repo "$GH_REPO" --body "/fix"
          done <<<"$ISSUES"
